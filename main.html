<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#6366f1" />
<meta name="description" content="一个简洁的本地情绪记录工具：每天记录心情、标签与随笔，自动生成日历与统计。可免费部署于 Cloudflare Pages。" />
<title>心情日记 · 情绪记录工具</title>
<script>
/* 提前应用主题，避免首屏闪烁 */
try {
  var t = localStorage.getItem('mood-journal-theme');
  if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
} catch (e) {}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f3f5fa;
  --card: #ffffff;
  --text: #1e2230;
  --text-2: #6d7386;
  --border: #e5e8f1;
  --accent: #6366f1;
  --accent-2: #8b5cf6;
  --shadow: 0 10px 30px rgba(30, 34, 48, 0.07);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #13151d;
  --card: #1c1f29;
  --text: #e9ebf2;
  --text-2: #9198ab;
  --border: #2a2e3c;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.55;
  transition: background .3s ease, color .3s ease;
}
body::before, body::after {
  content: "";
  position: fixed;
  z-index: -1;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .5;
  pointer-events: none;
}
body::before { width: 420px; height: 420px; top: -140px; left: -120px; background: radial-gradient(circle, #c7d2fe, transparent 70%); }
body::after { width: 460px; height: 460px; bottom: -160px; right: -140px; background: radial-gradient(circle, #ddd6fe, transparent 70%); }
html[data-theme="dark"] body::before, html[data-theme="dark"] body::after { opacity: .16; }
button { font-family: inherit; }

.app { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }

/* ---------- 顶部 ---------- */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.logo {
  font-size: 24px; font-weight: 800; letter-spacing: .5px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.sub { font-size: 13px; color: var(--text-2); margin-top: 3px; }
.top-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.streak-badge {
  font-size: 12px; font-weight: 600; color: #b45309; background: #fef3c7;
  border-radius: 999px; padding: 6px 12px; white-space: nowrap;
}
html[data-theme="dark"] .streak-badge { color: #fbbf24; background: rgba(251, 191, 36, .14); }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: transform .15s, box-shadow .15s;
}
.icon-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow); }
.icon-btn:disabled { cursor: default; opacity: .35; }

/* ---------- 标签页 ---------- */
.tabs {
  display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border);
  padding: 5px; border-radius: 16px; margin: 20px 0 16px; box-shadow: var(--shadow);
}
.tab-btn {
  flex: 1; border: none; background: transparent; padding: 10px 8px; border-radius: 12px;
  font-size: 14px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: all .18s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; box-shadow: 0 4px 14px rgba(99, 102, 241, .35);
}

/* ---------- 视图与卡片 ---------- */
.view { display: none; }
.view.active { display: block; animation: fadeUp .28s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px;
  padding: 20px; box-shadow: var(--shadow);
}
.card + .card, .stat-grid + .card { margin-top: 14px; }
.card-title {
  font-size: 15px; font-weight: 700; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.muted { font-size: 12px; color: var(--text-2); font-weight: 400; }
.badge { font-size: 12px; font-weight: 600; color: #16a34a; background: #dcfce7; padding: 4px 10px; border-radius: 999px; }
html[data-theme="dark"] .badge { color: #4ade80; background: rgba(34, 197, 94, .15); }

.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
.date-input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit;
}
textarea {
  width: 100%; min-height: 88px; padding: 12px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; resize: vertical;
}
textarea:focus, .date-input:focus { outline: 2px solid rgba(99, 102, 241, .4); border-color: var(--accent); }

/* ---------- 心情选择 ---------- */
.mood-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.mood-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 12px 2px; border-radius: 14px; border: 2px solid var(--border);
  background: transparent; cursor: pointer;
  transition: transform .16s, border-color .16s, background .16s;
}
.mood-btn:hover { transform: translateY(-3px); }
.mood-emoji { font-size: 26px; line-height: 1; }
.mood-label { font-size: 11px; color: var(--text-2); font-weight: 600; }
.mood-btn.selected .mood-label { color: var(--text); }

/* ---------- 标签 ---------- */
.tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-chip {
  padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border);
  background: transparent; color: var(--text-2); font-size: 13px; cursor: pointer; transition: all .15s;
}
.tag-chip:hover { border-color: var(--accent); color: var(--accent); }
.tag-chip.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; }

/* ---------- 按钮 ---------- */
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; align-items: center; }
.btn {
  border: none; padding: 11px 20px; border-radius: 12px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: transform .15s, box-shadow .15s, color .15s, border-color .15s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: none; }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 6px 16px rgba(99, 102, 241, .32); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-2); }
.btn-ghost:hover { color: var(--text); border-color: var(--text-2); }
.btn-danger { color: #e11d48; }
.btn-danger:hover { border-color: #e11d48; color: #e11d48; }
.btn-danger-solid { background: #e11d48; color: #fff; }
.btn-sm { padding: 7px 12px; font-size: 13px; }

/* ---------- 日历 ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.cal-title { font-size: 16px; font-weight: 700; }
.cal-head-right { display: flex; align-items: center; gap: 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-weekday { text-align: center; font-size: 12px; color: var(--text-2); font-weight: 600; padding: 4px 0; }
.cal-cell {
  position: relative; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 12px;
  background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; cursor: pointer; color: var(--text-2); padding: 0;
  transition: transform .15s, box-shadow .15s;
}
.cal-cell:hover { transform: scale(1.07); z-index: 1; box-shadow: var(--shadow); }
.cal-cell.empty { visibility: hidden; cursor: default; }
.cal-cell.today { box-shadow: 0 0 0 2px var(--accent); }
.cal-num { font-size: 12px; font-weight: 600; }
.cal-emoji { font-size: 15px; line-height: 1; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* ---------- 统计 ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 560px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
.stat-card { text-align: center; padding: 16px 10px; }
.stat-num { font-size: 24px; font-weight: 800; line-height: 1.2; }
.stat-label { font-size: 12px; color: var(--text-2); margin-top: 4px; }

.trend { display: flex; align-items: flex-end; gap: 3px; height: 130px; padding-top: 6px; }
.trend-bar { flex: 1; min-width: 0; border-radius: 6px 6px 4px 4px; background: var(--accent); transition: height .3s ease; }
.trend-bar:hover { filter: brightness(1.12); }
.trend-bar.missing { height: 3px !important; background: var(--border); }
.trend-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-2); margin-top: 8px; }

.dist-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.dist-row:last-child { margin-bottom: 0; }
.dist-label { width: 78px; font-size: 13px; color: var(--text-2); flex-shrink: 0; }
.dist-track { flex: 1; height: 10px; background: var(--border); border-radius: 999px; overflow: hidden; }
.dist-fill { display: block; height: 100%; border-radius: 999px; transition: width .35s ease; }
.dist-count { width: 28px; text-align: right; font-size: 13px; font-weight: 700; }

.entry-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.entry-item:last-child { border-bottom: none; padding-bottom: 0; }
.entry-item:first-child { padding-top: 0; }
.entry-emoji { font-size: 24px; line-height: 1.2; }
.entry-body { flex: 1; min-width: 0; }
.entry-date { font-size: 13px; font-weight: 600; }
.entry-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.mini-tag { font-size: 11px; color: var(--text-2); background: var(--bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; }
.entry-note { font-size: 13px; color: var(--text-2); margin-top: 4px; word-break: break-word; }
.empty-tip { text-align: center; color: var(--text-2); font-size: 13px; padding: 18px 0; }

.foot { text-align: center; font-size: 12px; color: var(--text-2); margin-top: 26px; line-height: 1.7; }

/* ---------- 提示与弹窗 ---------- */
.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 16px);
  background: var(--text); color: var(--bg); font-size: 14px; font-weight: 500;
  padding: 11px 20px; border-radius: 999px; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 200;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .25); max-width: 86vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 18, 28, .5); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  z-index: 300; animation: fadeIn .2s ease;
}
.modal {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px;
  width: 100%; max-width: 330px; box-shadow: 0 24px 60px rgba(0, 0, 0, .3); animation: fadeUp .22s ease;
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-text { font-size: 13px; color: var(--text-2); margin: 8px 0 18px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

@media (max-width: 420px) {
  .app { padding: 20px 12px 40px; }
  .card { padding: 16px; }
  .mood-emoji { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="logo">🌤 心情日记</div>
      <div class="sub" id="header-date">—</div>
    </div>
    <div class="top-right">
      <span class="streak-badge" id="streak-badge" hidden>🔥 连续 0 天</span>
      <button class="icon-btn" id="theme-toggle" type="button" title="切换深色 / 浅色模式">🌙</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" type="button" data-view="record">✏️ 记录</button>
    <button class="tab-btn" type="button" data-view="calendar">📅 日历</button>
    <button class="tab-btn" type="button" data-view="stats">📊 统计</button>
  </nav>

  <main>
    <!-- 记录页 -->
    <section class="view active" id="view-record">
      <div class="card">
        <div class="card-title">
          <span>今天感觉怎么样？</span>
          <span class="badge" id="record-badge" hidden>✓ 已记录</span>
        </div>
        <label class="field-label" for="entry-date">日期（可补记过去的心情）</label>
        <input type="date" id="entry-date" class="date-input" />
        <div class="field-label" style="margin-top:18px">选择心情</div>
        <div class="mood-row" id="mood-row"></div>
        <div class="field-label" style="margin-top:18px">发生了什么？（可多选）</div>
        <div class="tag-row" id="tag-row"></div>
        <label class="field-label" for="note-input" style="margin-top:18px">随笔 <span class="muted" id="note-count">0/200</span></label>
        <textarea id="note-input" maxlength="200" placeholder="随手写点什么，比如今天的小确幸或小烦恼……"></textarea>
        <div class="actions">
          <button class="btn btn-primary" id="save-btn" type="button">保存今天的心情</button>
          <button class="btn btn-ghost btn-danger" id="delete-btn" type="button" hidden>删除这条记录</button>
        </div>
      </div>
    </section>

    <!-- 日历页 -->
    <section class="view" id="view-calendar">
      <div class="card">
        <div class="cal-head">
          <button class="icon-btn" id="cal-prev" type="button" title="上个月">‹</button>
          <div class="cal-title" id="cal-title">—</div>
          <div class="cal-head-right">
            <button class="btn btn-ghost btn-sm" id="cal-today" type="button">回到今天</button>
            <button class="icon-btn" id="cal-next" type="button" title="下个月">›</button>
          </div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-legend" id="cal-legend"></div>
      </div>
    </section>

    <!-- 统计页 -->
    <section class="view" id="view-stats">
      <div class="stat-grid">
        <div class="card stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">累计记录（天）</div></div>
        <div class="card stat-card"><div class="stat-num" id="stat-streak">0</div><div class="stat-label">连续记录（天）</div></div>
        <div class="card stat-card"><div class="stat-num" id="stat-avg">–</div><div class="stat-label">平均心情</div></div>
        <div class="card stat-card"><div class="stat-num" id="stat-month">0</div><div class="stat-label">本月记录（天）</div></div>
      </div>
      <div class="card">
        <div class="card-title"><span>最近 30 天心情趋势</span><span class="muted">柱子越高越开心</span></div>
        <div class="trend" id="trend-chart"></div>
        <div class="trend-axis"><span>30 天前</span><span>今天</span></div>
      </div>
      <div class="card">
        <div class="card-title">心情分布</div>
        <div id="dist-list"></div>
      </div>
      <div class="card">
        <div class="card-title">最近记录</div>
        <div id="recent-list"></div>
      </div>
      <div class="card">
        <div class="card-title"><span>数据管理</span><span class="muted">数据仅保存在本机浏览器</span></div>
        <div class="actions">
          <button class="btn btn-ghost" id="export-btn" type="button">⬇ 导出备份</button>
          <button class="btn btn-ghost" id="import-btn" type="button">⬆ 导入数据</button>
          <button class="btn btn-ghost btn-danger" id="clear-btn" type="button">🗑 清空全部</button>
          <input type="file" id="import-file" accept=".json,application/json" hidden />
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    数据保存在浏览器本地（localStorage），不上传任何服务器<br />
    换设备或清理浏览器前，请先到「统计 → 导出备份」
  </footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ================= 常量与工具 ================= */
  var LS_KEY = 'mood-journal-entries-v1';
  var LS_THEME = 'mood-journal-theme';

  var MOODS = {
    1: { emoji: '😢', label: '很难过', color: '#5b8def' },
    2: { emoji: '😔', label: '低落', color: '#38b6d9' },
    3: { emoji: '😐', label: '一般', color: '#8f96a8' },
    4: { emoji: '🙂', label: '不错', color: '#f5a83d' },
    5: { emoji: '😄', label: '超棒', color: '#f1663f' }
  };
  var MOOD_KEYS = [1, 2, 3, 4, 5];
  var TAGS = ['工作', '学习', '运动', '社交', '家庭', '睡眠', '美食', '阅读', '游戏', '天气', '旅行'];
  var WEEK_ORDER = ['一', '二', '三', '四', '五', '六', '日'];

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function toKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function keyToDate(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function todayKey() { return toKey(new Date()); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDateCN(k) { var p = k.split('-'); return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日'; }
  function weekdayCN(k) { return '星期' + WEEK_ORDER[(keyToDate(k).getDay() + 6) % 7]; }
  function moodFace(avg) { return MOODS[Math.max(1, Math.min(5, Math.round(avg)))].emoji; }

  function loadAll() {
    try {
      var v = JSON.parse(localStorage.getItem(LS_KEY));
      return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
    } catch (e) { return {}; }
  }
  function saveAll(obj) { localStorage.setItem(LS_KEY, JSON.stringify(obj)); }

  /* ================= 轻提示 ================= */
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  /* ================= 确认弹窗 ================= */
  function confirmDialog(opts) {
    return new Promise(function (resolve) {
      var mask = document.createElement('div');
      mask.className = 'modal-mask';
      mask.innerHTML =
        '<div class="modal">' +
        '<h3 class="modal-title">' + esc(opts.title || '确认操作') + '</h3>' +
        (opts.text ? '<p class="modal-text">' + esc(opts.text) + '</p>' : '') +
        '<div class="modal-actions">' +
        '<button type="button" class="btn btn-ghost" data-act="cancel">取消</button>' +
        '<button type="button" class="btn ' + (opts.danger ? 'btn-danger-solid' : 'btn-primary') + '" data-act="ok">' + esc(opts.okText || '确定') + '</button>' +
        '</div></div>';
      document.body.appendChild(mask);
      function done(val) { mask.remove(); resolve(val); }
      mask.querySelector('[data-act="ok"]').addEventListener('click', function () { done(true); });
      mask.querySelector('[data-act="cancel"]').addEventListener('click', function () { done(false); });
      mask.addEventListener('click', function (e) { if (e.target === mask) done(false); });
    });
  }

  /* ================= 主题 ================= */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem(LS_THEME, theme); } catch (e) {}
    $('#theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(LS_THEME); } catch (e) {}
    applyTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    $('#theme-toggle').addEventListener('click', function () {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }

  /* ================= 记录页 ================= */
  var selectedMood = null;
  var selectedTags = {};

  function buildMoodButtons() {
    var row = $('#mood-row');
    MOOD_KEYS.forEach(function (v) {
      var m = MOODS[v];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'mood-btn';
      b.setAttribute('data-mood', v);
      b.setAttribute('aria-label', m.label);
      b.innerHTML = '<span class="mood-emoji">' + m.emoji + '</span><span class="mood-label">' + m.label + '</span>';
      b.addEventListener('click', function () {
        selectedMood = v;
        paintMoodButtons();
      });
      row.appendChild(b);
    });
  }
  function paintMoodButtons() {
    $all('.mood-btn').forEach(function (b) {
      var v = Number(b.getAttribute('data-mood'));
      var on = v === selectedMood;
      b.classList.toggle('selected', on);
      b.style.borderColor = on ? MOODS[v].color : '';
      b.style.background = on ? MOODS[v].color + '1f' : '';
    });
  }

  function buildTagChips() {
    var row = $('#tag-row');
    TAGS.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tag-chip';
      b.setAttribute('data-tag', t);
      b.textContent = t;
      b.addEventListener('click', function () {
        if (selectedTags[t]) { delete selectedTags[t]; } else { selectedTags[t] = true; }
        b.classList.toggle('active', !!selectedTags[t]);
      });
      row.appendChild(b);
    });
  }

  function loadForm(date) {
    var all = loadAll();
    var e = all[date];
    selectedMood = e ? e.mood : null;
    selectedTags = {};
    if (e && e.tags) { e.tags.forEach(function (t) { selectedTags[t] = true; }); }
    $('#note-input').value = (e && e.note) ? e.note : '';
    paintMoodButtons();
    $all('.tag-chip').forEach(function (b) {
      b.classList.toggle('active', !!selectedTags[b.getAttribute('data-tag')]);
    });
    updateNoteCount();
    var has = !!e;
    $('#delete-btn').hidden = !has;
    $('#record-badge').hidden = !has;
    $('#save-btn').textContent = has ? '更新记录' : (date === todayKey() ? '保存今天的心情' : '保存这条记录');
  }

  function updateNoteCount() {
    $('#note-count').textContent = $('#note-input').value.length + '/200';
  }

  function saveEntry() {
    var date = $('#entry-date').value;
    if (!date) { toast('请先选择日期'); return; }
    if (!selectedMood) { toast('先选择一个心情吧'); return; }
    var all = loadAll();
    all[date] = {
      mood: selectedMood,
      tags: Object.keys(selectedTags),
      note: $('#note-input').value.trim().slice(0, 200),
      updatedAt: Date.now()
    };
    saveAll(all);
    toast('保存成功，记录下来啦 ✓');
    loadForm(date);
    refreshChrome();
  }

  function deleteEntry() {
    var date = $('#entry-date').value;
    confirmDialog({
      title: '删除这条记录？',
      text: fmtDateCN(date) + ' 的心情记录将被删除，且无法恢复。',
      danger: true,
      okText: '删除'
    }).then(function (ok) {
      if (!ok) { return; }
      var all = loadAll();
      delete all[date];
      saveAll(all);
      loadForm(date);
      refreshChrome();
      toast('已删除');
    });
  }

  /* ================= 日历页 ================= */
  var calCursor = (function () {
    var p = todayKey().split('-');
    return new Date(+p[0], +p[1] - 1, 1);
  })();

  function renderLegend() {
    $('#cal-legend').innerHTML = MOOD_KEYS.map(function (v) {
      var m = MOODS[v];
      return '<span class="legend-item"><span class="legend-dot" style="background:' + m.color + '"></span>' +
        m.emoji + ' ' + m.label + '</span>';
    }).join('');
  }

  function renderCalendar() {
    var y = calCursor.getFullYear();
    var mo = calCursor.getMonth();
    $('#cal-title').textContent = y + '年' + (mo + 1) + '月';

    var now = new Date();
    var atCurrentMonth = (y === now.getFullYear() && mo === now.getMonth());
    var nextBtn = $('#cal-next');
    nextBtn.disabled = atCurrentMonth;

    var first = new Date(y, mo, 1);
    var offset = (first.getDay() + 6) % 7; /* 周一为一周第一天 */
    var days = new Date(y, mo + 1, 0).getDate();
    var all = loadAll();
    var todayK = todayKey();

    var html = WEEK_ORDER.map(function (w) { return '<div class="cal-weekday">' + w + '</div>'; }).join('');
    var i;
    for (i = 0; i < offset; i++) { html += '<div class="cal-cell empty"></div>'; }
    for (var d = 1; d <= days; d++) {
      var key = y + '-' + pad2(mo + 1) + '-' + pad2(d);
      var e = all[key];
      var cls = 'cal-cell';
      if (e) { cls += ' has'; }
      if (key === todayK) { cls += ' today'; }
      var style = e
        ? ' style="background:' + MOODS[e.mood].color + '26;border-color:' + MOODS[e.mood].color + '55"'
        : '';
      var tip = fmtDateCN(key) + (e ? ' · ' + MOODS[e.mood].label : ' · 未记录');
      html += '<button type="button" class="' + cls + '"' + style + ' data-date="' + key + '" title="' + esc(tip) + '">' +
        '<span class="cal-num">' + d + '</span>' +
        (e ? '<span class="cal-emoji">' + MOODS[e.mood].emoji + '</span>' : '') +
        '</button>';
    }
    $('#cal-grid').innerHTML = html;

    $all('#cal-grid .cal-cell[data-date]').forEach(function (cell) {
      cell.addEventListener('click', function () {
        var k = cell.getAttribute('data-date');
        $('#entry-date').value = k;
        loadForm(k);
        switchTab('record');
      });
    });
  }

  /* ================= 统计页 ================= */
  function computeStats() {
    var all = loadAll();
    var keys = Object.keys(all).filter(function (k) {
      return /^\d{4}-\d{2}-\d{2}$/.test(k) && all[k] && all[k].mood >= 1 && all[k].mood <= 5;
    }).sort();

    var total = keys.length;
    var sum = keys.reduce(function (s, k) { return s + all[k].mood; }, 0);
    var avg = total ? sum / total : 0;

    var streak = 0;
    var cur = new Date();
    if (!all[toKey(cur)]) { cur.setDate(cur.getDate() - 1); }
    while (all[toKey(cur)]) { streak++; cur.setDate(cur.getDate() - 1); }

    var now = new Date();
    var prefix = now.getFullYear() + '-' + pad2(now.getMonth() + 1);
    var month = keys.filter(function (k) { return k.indexOf(prefix) === 0; }).length;

    return { all: all, keys: keys, total: total, avg: avg, streak: streak, month: month };
  }

  function renderStats() {
    var s = computeStats();
    $('#stat-total').textContent = s.total;
    $('#stat-streak').textContent = s.streak;
    $('#stat-avg').textContent = s.total ? s.avg.toFixed(1) + ' ' + moodFace(s.avg) : '–';
    $('#stat-month').textContent = s.month;

    /* 最近 30 天趋势 */
    var base = new Date();
    var days = [];
    for (var i = 29; i >= 0; i--) {
      days.push(toKey(new Date(base.getFullYear(), base.getMonth(), base.getDate() - i)));
    }
    var trendHtml = '';
    days.forEach(function (k) {
      var e = s.all[k];
      if (e) {
        var m = MOODS[e.mood];
        trendHtml += '<div class="trend-bar" style="height:' + Math.round(e.mood / 5 * 100) + '%;background:' + m.color +
          '" title="' + esc(fmtDateCN(k) + ' · ' + m.label) + '"></div>';
      } else {
        trendHtml += '<div class="trend-bar missing" title="' + esc(fmtDateCN(k) + ' · 未记录') + '"></div>';
      }
    });
    $('#trend-chart').innerHTML = trendHtml;

    /* 心情分布 */
    var counts = {};
    MOOD_KEYS.forEach(function (v) { counts[v] = 0; });
    s.keys.forEach(function (k) { counts[s.all[k].mood]++; });
    var max = Math.max.apply(null, MOOD_KEYS.map(function (v) { return counts[v]; })) || 1;
    $('#dist-list').innerHTML = MOOD_KEYS.slice().reverse().map(function (v) {
      var m = MOODS[v];
      var pct = Math.round(counts[v] / max * 100);
      return '<div class="dist-row"><span class="dist-label">' + m.emoji + ' ' + m.label + '</span>' +
        '<span class="dist-track"><span class="dist-fill" style="width:' + pct + '%;background:' + m.color + '"></span></span>' +
        '<span class="dist-count">' + counts[v] + '</span></div>';
    }).join('');

    /* 最近记录 */
    var recent = s.keys.slice(-8).reverse();
    if (!recent.length) {
      $('#recent-list').innerHTML = '<div class="empty-tip">还没有记录，去「记录」页写下第一条心情吧</div>';
    } else {
      $('#recent-list').innerHTML = recent.map(function (k) {
        var e = s.all[k];
        var m = MOODS[e.mood];
        var tags = (e.tags || []).map(function (t) { return '<span class="mini-tag">' + esc(t) + '</span>'; }).join('');
        var note = e.note ? '<div class="entry-note">' + esc(e.note) + '</div>' : '';
        return '<div class="entry-item"><span class="entry-emoji">' + m.emoji + '</span>' +
          '<div class="entry-body"><div class="entry-date">' + fmtDateCN(k) + ' ' + weekdayCN(k) + '</div>' +
          (tags ? '<div class="entry-tags">' + tags + '</div>' : '') + note + '</div></div>';
      }).join('');
    }
  }

  /* ================= 顶部信息 ================= */
  function refreshChrome() {
    var now = new Date();
    $('#header-date').textContent = fmtDateCN(toKey(now)) + ' ' + weekdayCN(toKey(now));
    var streak = computeStats().streak;
    var badge = $('#streak-badge');
    if (streak > 0) {
      badge.hidden = false;
      badge.textContent = '🔥 连续记录 ' + streak + ' 天';
    } else {
      badge.hidden = true;
    }
    renderCalendar();
    renderStats();
  }

  /* ================= 标签页切换 ================= */
  function switchTab(name) {
    $all('.tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-view') === name);
    });
    $all('.view').forEach(function (v) {
      v.classList.toggle('active', v.id === 'view-' + name);
    });
    if (name === 'stats') { renderStats(); }
    if (name === 'calendar') { renderCalendar(); }
  }

  /* ================= 导入 / 导出 / 清空 ================= */
  function sanitizeImport(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) { return null; }
    var out = {};
    Object.keys(raw).forEach(function (k) {
      var v = raw[k];
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) { return; }
      if (!v || typeof v !== 'object') { return; }
      var mood = Number(v.mood);
      if (!(mood >= 1 && mood <= 5)) { return; }
      var tags = Array.isArray(v.tags) ? v.tags.filter(function (t) { return typeof t === 'string'; }).slice(0, 12) : [];
      var note = typeof v.note === 'string' ? v.note.slice(0, 200) : '';
      out[k] = { mood: Math.round(mood), tags: tags, note: note };
    });
    return Object.keys(out).length ? out : null;
  }

  function exportData() {
    var data = loadAll();
    var keys = Object.keys(data);
    if (!keys.length) { toast('还没有数据可导出'); return; }
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '心情日记-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('已导出 ' + keys.length + ' 条记录');
  }

  function importData(ev) {
    var file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file) { return; }
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = JSON.parse(reader.result); } catch (e) { toast('文件不是有效的 JSON'); return; }
      var clean = sanitizeImport(parsed);
      if (!clean) { toast('文件中没有可导入的有效记录'); return; }
      var n = Object.keys(clean).length;
      confirmDialog({
        title: '导入数据',
        text: '将合并 ' + n + ' 条记录，日期相同的记录会被覆盖。',
        okText: '导入'
      }).then(function (ok) {
        if (!ok) { return; }
        var all = loadAll();
        Object.keys(clean).forEach(function (k) { all[k] = clean[k]; });
        saveAll(all);
        loadForm($('#entry-date').value);
        refreshChrome();
        toast('成功导入 ' + n + ' 条记录');
      });
    };
    reader.onerror = function () { toast('读取文件失败'); };
    reader.readAsText(file);
  }

  function clearData() {
    if (!Object.keys(loadAll()).length) { toast('当前没有数据'); return; }
    confirmDialog({
      title: '清空全部数据？',
      text: '所有心情记录都会被永久删除，建议先导出备份。',
      danger: true,
      okText: '全部清空'
    }).then(function (ok) {
      if (!ok) { return; }
      saveAll({});
      loadForm($('#entry-date').value);
      refreshChrome();
      toast('已清空全部数据');
    });
  }

  /* ================= 初始化 ================= */
  function init() {
    initTheme();
    renderLegend();
    buildMoodButtons();
    buildTagChips();

    var today = todayKey();
    var de = $('#entry-date');
    de.value = today;
    de.max = today;
    de.addEventListener('change', function () { loadForm(de.value || today); });

    $('#note-input').addEventListener('input', updateNoteCount);
    $('#save-btn').addEventListener('click', saveEntry);
    $('#delete-btn').addEventListener('click', deleteEntry);

    $('#cal-prev').addEventListener('click', function () {
      calCursor.setMonth(calCursor.getMonth() - 1);
      renderCalendar();
    });
    $('#cal-next').addEventListener('click', function () {
      calCursor.setMonth(calCursor.getMonth() + 1);
      renderCalendar();
    });
    $('#cal-today').addEventListener('click', function () {
      var p = todayKey().split('-');
      calCursor = new Date(+p[0], +p[1] - 1, 1);
      renderCalendar();
    });

    $('#export-btn').addEventListener('click', exportData);
    $('#import-btn').addEventListener('click', function () { $('#import-file').click(); });
    $('#import-file').addEventListener('change', importData);
    $('#clear-btn').addEventListener('click', clearData);

    $all('.tab-btn').forEach(function (b) {
      b.addEventListener('click', function () { switchTab(b.getAttribute('data-view')); });
    });

    loadForm(today);
    refreshChrome();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
